<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECC Wall Player</title>
<script src="config.js"></script>
<script src="wall-layout.js"></script>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #stage{position:fixed;inset:0;background:#000}
  .buf{position:absolute;inset:0;width:100vw;height:100vh;opacity:0;background:#000;
       transition:opacity .9s ease;will-change:opacity,transform;backface-visibility:hidden}
  .buf.front{opacity:1}
  .buf iframe{border:0;width:100%;height:100%;display:block;background:#000}
  .crop iframe{height:calc(100% + var(--crop,0px)) !important;margin-top:calc(-1 * var(--crop,0px)) !important}
  .fillw iframe{width:calc(100% + 18px) !important} /* hide PBI's internal scrollbar off-screen */
  #boot{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;background:radial-gradient(ellipse at center,#12463a 0%,#0a2a22 70%,#061d17 100%);
    color:#dff2e8;font-family:Segoe UI,sans-serif}
  #boot .b1{font-size:2.2vw;letter-spacing:.25em;opacity:.85}
  #boot .b2{font-size:5vw;font-weight:700;letter-spacing:.1em}
  #boot .b3{font-size:1.4vw;opacity:.7}
  #boot .spin{width:3.2vw;height:3.2vw;border:.35vw solid rgba(255,255,255,.15);
    border-top-color:#39c98e;border-radius:50%;animation:bsp 1s linear infinite}
  @keyframes bsp{to{transform:rotate(360deg)}}
  #keyerr{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    background:#1a0d0d;color:#e8b4b4;font-family:Segoe UI,sans-serif;font-size:2vw;text-align:center}
  #identify{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;
    background:rgba(6,29,23,.92);color:#fff;font:700 18vw Segoe UI,sans-serif;letter-spacing:.05em}
</style>
</head>
<body>
<div id="stage">
  <div class="buf" id="bufA"><iframe id="ifrA" allowfullscreen></iframe><div id="pbiA" style="width:100%;height:100%;display:none"></div></div>
  <div class="buf" id="bufB"><iframe id="ifrB" allowfullscreen></iframe><div id="pbiB" style="width:100%;height:100%;display:none"></div></div>
</div>
<div id="boot"><div class="b1">DR. SULAIMAN AL HABIB — ECC WALL</div><div class="b2" id="bootId"></div>
  <div class="spin"></div><div class="b3" id="bootWhy">Loading dashboard…</div></div>
<div id="keyerr">Access key missing or wrong.<br>Check the screen link.</div>
<div id="identify"></div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const C = window.WALLCFG;
const qs = new URLSearchParams(location.search);
const SCREEN = (qs.get("s")||"R1C1").toUpperCase();
const KEY = qs.get("k")||"";
document.getElementById("bootId").textContent = SCREEN;
const sb = createClient(C.SUPA_URL, C.SUPA_KEY);
function safeStorage(){ try{ return window.localStorage; }catch(e){ return null; } }
/* screen enrolment: the screen's link from the console carries #d=<this PC's own device secret> in the
   fragment (never sent to any server as part of the address). It is also kept in this PC's browser
   storage. It leaves the address bar only once the storage gives the same secret back; on a PC whose
   browser storage is blocked it stays there, so every in-page reload (03:00, "Reload all screens", the
   switch-off reload) still has it (checker_wallv2_r3 R3-M1). */
const DEVICE=(()=>{ const st=safeStorage(), k="wallDevice."+SCREEN;
  let d=""; try{ d=new URLSearchParams(String(location.hash||"").replace(/^#/,"")).get("d")||""; }catch(e){}
  if(/^[A-Za-z0-9_-]{43}$/.test(d)){
    let kept=false; try{ if(st){ st.setItem(k,d); kept=(st.getItem(k)===d); } }catch(e){ kept=false; }
    if(kept){ try{ history.replaceState({},"",location.pathname+location.search); }catch(e){} }
    return d; }
  try{ return (st&&st.getItem(k))||""; }catch(e){ return ""; } })();
/* this page session (proof for the console that the PC kept its secret after a restart) */
const SID=(()=>{ try{ return [...crypto.getRandomValues(new Uint8Array(8))].map(b=>b.toString(16).padStart(2,"0")).join(""); }catch(e){ return ""; } })();
let STOP=false, LEGACY_FN=false, RELOAD_SEEN=0;
/* "Reload all screens" (settings.data._reloadAt): only a value NEWER than the one this page started with
   reloads it, so an older value written back by another console button does nothing (R3-L1); checked on
   realtime and on the 5-minute poll, so a press missed by realtime still arrives (R3-L2). Mirrors never reload. */
function reloadIfNewer(){ const v=+SETTINGS._reloadAt||0;
  if(v>RELOAD_SEEN&&qs.get("mirror")!=="1"){ RELOAD_SEEN=v; location.reload(); return true; } return false; }

/* ---------- state ---------- */
let SETTINGS={}, SCENES=[], CONTENT=[], ROT=null, ASSIGN=null;
let gen=0, currentUrl=null, lastCmd=null;
let CLOCK_OFFSET=0; /* serverNow - localNow: every screen shares one clock */
/* canvasPages (settings.data.canvasPages===true) only: shared clock, figures feed, wall pages.
   Switch off: CANVAS stays empty and every line below behaves exactly as before. */
const CANVAS={on:false,clock:null,feed:null,ready:null,err:null,pages:{}};
const NOW=()=>(CANVAS.clock&&CANVAS.clock.isSynced())?CANVAS.clock.now():Date.now()+CLOCK_OFFSET;
async function syncClock(){
  try{ const t0=Date.now();
    const r=await fetch(C.TOKEN_FN+"?now=1"); const j=await r.json();
    const rtt=Date.now()-t0;
    CLOCK_OFFSET=(j.now+rtt/2)-Date.now();
  }catch(e){}
}
const bufs={a:{el:bufA,ifr:ifrA,pbi:pbiA,id:"a"},b:{el:bufB,ifr:ifrB,pbi:pbiB,id:"b"}};
let front=bufs.a, back=bufs.b;
const WARM={a:null,b:null}, WARMLOADING={a:null,b:null};
let pbiReports={}, pbiMeta={}, powerbiReady=null, warmGen=0;
const cById=id=>CONTENT.find(x=>x.id===id);

function hideBoot(){const b=document.getElementById("boot");if(b)b.style.display="none";}
function after(ms,f){return setTimeout(f,ms);}
function isPbi(u){return /app\.(powerbi|fabric\.microsoft)\.com\/reportEmbed/i.test(u||"");}
function loadSdk(){ if(powerbiReady) return powerbiReady;
  powerbiReady=new Promise(res=>{const s=document.createElement("script");s.src=C.PBI_SDK;s.onload=res;document.head.appendChild(s);});
  return powerbiReady; }

function wallDelay(){ /* Wall Sequencer: deterministic wave offset for THIS screen (0 = today's behavior) */
  const ws=SETTINGS.wallSeq;
  if(!ws||!ws.enabled) return 0;
  return WallLayout.waveDelay(SCREEN,ws,"player"); /* shape from wall-layout.js; same arithmetic as before */
}
function dateFilterArr(models){
  const f=SETTINGS.dateFilter;
  if(!f||!f.enabled||!f.table||!f.column||!(+f.count>0)) return [];
  const unitMap={days:models.RelativeDateFilterTimeUnit.Days,
    weeks:models.RelativeDateFilterTimeUnit.Weeks,
    months:models.RelativeDateFilterTimeUnit.Months,
    years:models.RelativeDateFilterTimeUnit.Years};
  return [{
    $schema:"http://powerbi.com/product/schema#relativeDate",
    target:{table:f.table,column:f.column},
    filterType:models.FilterType.RelativeDate,
    operator:models.RelativeDateOperators.InLast,
    timeUnitsCount:+f.count,
    timeUnitType:unitMap[f.unit||"days"] ?? unitMap.days,
    includeToday:f.includeToday!==false
  }];
}
function resetView(b){ b.el.classList.remove("crop"); b.el.classList.remove("fillw"); b.el.style.removeProperty("--crop"); }
function cleanBuf(b){
  WARM[b.id]=null; WARMLOADING[b.id]=null; resetView(b);
  if(pbiReports[b.id]){ try{window.powerbi&&powerbi.reset(b.pbi);}catch(e){} delete pbiReports[b.id]; }
  if(b.wpView){ try{b.wpView.destroy();}catch(e){} b.wpView=null; }   /* wall pages only (canvasPages on) */
  if(b.wp) b.wp.style.display="none";
  b.pbi.style.display="none"; b.ifr.style.display="block";
  try{b.ifr.src="about:blank";}catch(e){}
}
function swapRefs(){const t=front;front=back;back=t;}
function applyCrop(b,px){ if(px>0){b.el.classList.add("crop");b.el.style.setProperty("--crop",px+"px");} else resetView(b); }

/* ---------- effects (full library; keep-warm safe: layers animate, never reload) ---------- */
const EASE="cubic-bezier(.4,0,.2,1)";
function fxPair(fx){ /* returns [incomingKeyframes, outgoingKeyframes|null] */
  switch(fx){
    case "slide-left":  return [[{transform:"translateX(100%)"},{transform:"translateX(0)"}],null];
    case "slide-right": return [[{transform:"translateX(-100%)"},{transform:"translateX(0)"}],null];
    case "slide-up":    return [[{transform:"translateY(100%)"},{transform:"translateY(0)"}],null];
    case "slide-down":  return [[{transform:"translateY(-100%)"},{transform:"translateY(0)"}],null];
    case "push-left":   return [[{transform:"translateX(100%)"},{transform:"translateX(0)"}],
                                [{transform:"translateX(0)"},{transform:"translateX(-100%)"}]];
    case "push-right":  return [[{transform:"translateX(-100%)"},{transform:"translateX(0)"}],
                                [{transform:"translateX(0)"},{transform:"translateX(100%)"}]];
    case "zoom-in":     return [[{transform:"scale(1.15)",opacity:0},{transform:"scale(1)",opacity:1}],null];
    case "zoom-out":    return [[{transform:"scale(.85)",opacity:0},{transform:"scale(1)",opacity:1}],null];
    case "wipe-left":   return [[{clipPath:"inset(0 0 0 100%)"},{clipPath:"inset(0 0 0 0)"}],null];
    case "wipe-right":  return [[{clipPath:"inset(0 100% 0 0)"},{clipPath:"inset(0 0 0 0)"}],null];
    case "wipe-up":     return [[{clipPath:"inset(100% 0 0 0)"},{clipPath:"inset(0 0 0 0)"}],null];
    case "wipe-down":   return [[{clipPath:"inset(0 0 100% 0)"},{clipPath:"inset(0 0 0 0)"}],null];
    case "circle":      return [[{clipPath:"circle(0% at 50% 50%)"},{clipPath:"circle(75% at 50% 50%)"}],null];
    case "blur":        return [[{opacity:0,filter:"blur(18px)"},{opacity:1,filter:"blur(0px)"}],null];
    case "flip":        return [[{transform:"perspective(1600px) rotateY(70deg)",opacity:0},
                                 {transform:"perspective(1600px) rotateY(0deg)",opacity:1}],null];
    default:            return [[{opacity:0},{opacity:1}],null]; /* fade */
  }
}
function finalizeSwap(cmd,g,inc,out){
  if(g!==gen) return;
  if(currentUrl===cmd.url) return;               /* already finalized */
  try{ inc.getAnimations().forEach(a=>a.cancel()); }catch(e){}
  try{ out.getAnimations().forEach(a=>a.cancel()); }catch(e){}
  inc.classList.add("front"); out.classList.remove("front");
  inc.style.zIndex=""; out.style.zIndex="";
  inc.style.transition=""; out.style.transition="";
  swapRefs(); currentUrl=cmd.url; hideBoot(); WHY="";
}
function runEffect(cmd,g){
  if(g!==gen) return;
  if(cmd._waveMs===undefined){ cmd._waveMs=wallDelay(); }
  if(cmd._waveMs>0){ const d=cmd._waveMs; cmd._waveMs=0; after(d,()=>runEffect(cmd,g)); return; }
  const inc=back.el, out=front.el;
  const ms = cmd.effectMs || (C.SPEEDS&&C.SPEEDS[cmd.speed||SETTINGS.defaultSpeed||"normal"]) || 900;
  /* the swap is GUARANTEED: whatever happens to the animation below,
     this finalizer verifies and completes the hand-off */
  after(ms+400,()=>finalizeSwap(cmd,g,inc,out));
  try{
    const fx = cmd.effect || SETTINGS.defaultTransition || "fade";
    inc.style.transition="none"; out.style.transition="none";
    const [ki,ko]=fxPair(fx);
    inc.classList.add("front");
    inc.style.zIndex="2"; out.style.zIndex="1";
    const a1=inc.animate(ki,{duration:ms,easing:EASE,fill:"both"});
    if(ko) out.animate(ko,{duration:ms,easing:EASE,fill:"both"});
    else out.animate([{opacity:1},{opacity:1},{opacity:0}],{duration:ms,easing:"linear",fill:"both"});
    a1.onfinish=()=>finalizeSwap(cmd,g,inc,out);
  }catch(e){
    WHY="transition error: "+(e.message||e);
    finalizeSwap(cmd,g,inc,out);                 /* hard cut beats a stuck screen */
  }
}

/* ---------- loading ---------- */
/* text/plain keeps it a simple request: no extra preflight call per token request */
function tokenPost(body){ return fetch(C.TOKEN_FN,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(body)}); }
function tokenGet(contentId,fresh){ return fetch(C.TOKEN_FN+"?content="+encodeURIComponent(contentId)+"&k="+encodeURIComponent(KEY)+(fresh?"&fresh=1":"")); }
async function tokenConfigNet(contentId,fresh){
  const viaGet=LEGACY_FN; /* decide by the form THIS request used (the background check may switch it meanwhile) */
  let r = viaGet ? await tokenGet(contentId,fresh) : await tokenPost({content:contentId,s:SCREEN,k:KEY,d:DEVICE,fresh:!!fresh});
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!viaGet&&r.status===403&&j&&j.error==="bad key"){ /* maybe the old function is live (deployed first, or put back): old request form */
    const r2 = await tokenGet(contentId,fresh); let j2=null; try{ j2=await r2.json(); }catch(e){}
    if(!(r2.status===403&&j2&&j2.error==="bad key")){ LEGACY_FN=true; r=r2; j=j2; } }
  if(!r.ok){
    if(j&&j.error==="not_enrolled"){ enrolNotice(true); WHY="screen not set up: reports need this PC's one-time link"; throw new Error("not_enrolled"); }
    if(j&&j.error==="account_mismatch"){ WHY="Microsoft sign-in is not the expected account: ask an admin to check the console"; throw new Error("account_mismatch"); }
    if(j&&j.error==="reauth_required"){ WHY="MICROSOFT RE-AUTH REQUIRED — open the console and click Authorize Microsoft"; throw new Error("reauth_required"); }
    if(j&&j.error==="retry_later"){ WHY="Microsoft sign-in service busy — retrying automatically"; throw new Error("retry_later"); }
    throw new Error("token fn "+r.status);
  }
  if(WHY&&(WHY.startsWith("MICROSOFT")||WHY.startsWith("Microsoft"))) WHY="";
  return j;
}
async function embedPbi(b,cmd,onRendered){
  await loadSdk();
  const cfg = await tokenConfig(cmd.contentId);
  const models = window["powerbi-client"].models;
  b.ifr.style.display="none"; b.pbi.style.display="block";
  try{powerbi.reset(b.pbi);}catch(e){}
  const conf={type:"report",id:cfg.reportId,embedUrl:cfg.embedUrl,accessToken:cfg.token,
    tokenType:(cfg.tokenType==="Aad"?models.TokenType.Aad:models.TokenType.Embed),
    filters:dateFilterArr(models),
    settings:{layoutType:models.LayoutType.Custom,
      customLayout:{displayOption:(SETTINGS.fit==="fill")?models.DisplayOption.FitToWidth:models.DisplayOption.FitToPage},
      panes:{filters:{visible:false},pageNavigation:{visible:false}}}};
  if(cfg.pageName) conf.pageName=cfg.pageName;
  const rep=powerbi.embed(b.pbi,conf);
  pbiReports[b.id]=rep; pbiMeta[b.id]=cmd.contentId;
  applyCrop(b, cmd.cropTop||0);
  b.el.classList.toggle("fillw", SETTINGS.fit==="fill");
  rep.on("rendered",()=>onRendered&&onRendered());
  rep.on("error",async ev=>{ console.error("pbi",ev&&ev.detail);
    try{const c2=await tokenConfig(cmd.contentId,true); await rep.setAccessToken(c2.token);
        try{rep.refresh();}catch(_){} }catch(e){}
  });
  return rep;
}
/* Report-token requests back off (checker_figs3b H1): a screen that is not set up, or that lost its secret, is refused by
   the token function on every try. After a refusal, EVERY path that asks for a report token (rotation steps, mounts,
   warm-up, retries, renewals, reloads) shares one pause: it doubles from 8 s to at most 15 minutes, goes back to nothing
   after a token is given, and is kept in this PC's storage so a reload does not start again at 8 s. While paused, at most
   one token request is in flight; the others wait for it and then see the pause. A screen whose tokens are given never
   fails, so it takes exactly the same path and makes exactly the same requests as before. */
const TB_KEY="wallTokenBackoff."+SCREEN+(qs.get("mirror")==="1"?".mirror":"");
let TOKEN_FAILS=(()=>{ try{ const st=safeStorage(); const n=st?parseInt(st.getItem(TB_KEY)||"0",10):0; return (n>=0&&n<=20)?n:0; }catch(e){ return 0; } })();
let TOKEN_NEXT=0, TOKEN_INFLIGHT=null;
function tokenFailed(){ TOKEN_FAILS=Math.min(TOKEN_FAILS+1,20); try{ const st=safeStorage(); if(st) st.setItem(TB_KEY,String(TOKEN_FAILS)); }catch(e){}
  const d=Math.min(8000*Math.pow(2,TOKEN_FAILS-1),900000); TOKEN_NEXT=Date.now()+d; return d; }
function tokenWorked(){ if(!TOKEN_FAILS) return; TOKEN_FAILS=0; TOKEN_NEXT=0; try{ const st=safeStorage(); if(st) st.removeItem(TB_KEY); }catch(e){} }
function tokenWait(){ return Math.max(8000,TOKEN_NEXT-Date.now()); }
async function tokenConfig(contentId,fresh){
  if(!TOKEN_FAILS) return tokenConfigNet(contentId,fresh).catch(e=>{ tokenFailed(); throw e; });   /* no refusal yet: exactly as before */
  if(TOKEN_INFLIGHT){ try{ await TOKEN_INFLIGHT; }catch(e){} }
  if(TOKEN_FAILS&&Date.now()<TOKEN_NEXT) throw new Error("token_backoff");                          /* paused: no request */
  const p=tokenConfigNet(contentId,fresh); TOKEN_INFLIGHT=p;
  try{ const j=await p; tokenWorked(); return j; }
  catch(e){ tokenFailed(); throw e; }
  finally{ if(TOKEN_INFLIGHT===p) TOKEN_INFLIGHT=null; }
}
function show(cmd){
  const g=++gen; lastCmd=cmd;
  if(cmd.url===currentUrl && !cmd.force) return;
  const warm=WARM[back.id];
  if(warm && warm.url===cmd.url && !cmd.force){ after(0,()=>{if(g===gen)runEffect(cmd,g);}); return; }
  const wl=WARMLOADING[back.id];
  if(wl && wl.url===cmd.url && !cmd.force && Date.now()-wl.startedAt<60000){
    const iv=setInterval(()=>{ if(g!==gen){clearInterval(iv);return;}
      if(WARM[back.id]&&WARM[back.id].url===cmd.url){clearInterval(iv);runEffect(cmd,g);}
      else if(!WARMLOADING[back.id]){clearInterval(iv);coldLoad(cmd,g);}},250);
    after(60000,()=>clearInterval(iv)); return;
  }
  coldLoad(cmd,g);
}
function coldLoad(cmd,g){
  cleanBuf(back);
  if(cmd.wallpage){ /* canvasPages on only: cmdFor never sets .wallpage when the switch is off */
    const b=back;
    wpLoad(b,cmd).then(()=>{ if(g!==gen) return;
      WARM[b.id]={url:cmd.url}; WARMLOADING[b.id]=null;
      after(cmd.settleMs,()=>runEffect(cmd,g)); })
    .catch(()=>{ CANVAS.err="PAGE_UNAVAILABLE"; WHY="wall page not available";
      if(g===gen) after(8000,()=>{currentUrl=null;show(cmd);}); });
    return;
  }
  if(cmd.tokenEmbed&&cmd.contentId){
    let settled=false;
    embedPbi(back,cmd,()=>{ if(settled||g!==gen)return; settled=true;
      WARM[back.id]={url:cmd.url}; WARMLOADING[back.id]=null;
      after(Math.min(cmd.settleMs||3000,3000),()=>runEffect(cmd,g));
    }).catch(e=>{console.error(e); if(g===gen) after(TOKEN_FAILS?tokenWait():8000,()=>{currentUrl=null;show(cmd);});});
    after(45000,()=>{ if(!settled&&g===gen){settled=true;runEffect(cmd,g);} });
  }else{
    const t=back.ifr; back.pbi.style.display="none"; t.style.display="block";
    applyCrop(back,cmd.cropTop||0);
    let done=false;
    t.onload=()=>{ t.onload=null; if(done||g!==gen)return; done=true;
      WARM[back.id]={url:cmd.url}; WARMLOADING[back.id]=null;
      after(cmd.settleMs??800,()=>{ try{runEffect(cmd,g);}catch(e){WHY="show error: "+(e.message||e);} }); };
    after(30000,()=>{ if(!done&&g===gen){done=true;runEffect(cmd,g);} });
    try{t.src=cmd.url;}catch(e){}
  }
}
function prewarm(cmd){
  if(SETTINGS.prewarmEnabled===false) return;
  if(WARM[back.id]&&WARM[back.id].url===cmd.url) return;
  const wl0=WARMLOADING[back.id];
  if(wl0&&wl0.url===cmd.url&&Date.now()-wl0.startedAt<90000) return; /* already loading this: let it finish */
  if(lastCmd&&currentUrl!==lastCmd.url) return; /* a real load is in flight; the next tick will retry */
  const wg=++warmGen,g0=gen;
  cleanBuf(back); WARMLOADING[back.id]={url:cmd.url,startedAt:Date.now()};
  if(cmd.wallpage){ const b=back; /* canvasPages on only */
    wpLoad(b,cmd).then(()=>{ if(wg===warmGen&&g0===gen){WARM[b.id]={url:cmd.url};WARMLOADING[b.id]=null;} })
      .catch(()=>{WARMLOADING[b.id]=null;});
    return;
  }
  if(cmd.tokenEmbed&&cmd.contentId){
    embedPbi(back,cmd,()=>{ if(wg===warmGen&&g0===gen){WARM[back.id]={url:cmd.url};WARMLOADING[back.id]=null;} })
      .catch(()=>{WARMLOADING[back.id]=null;});
  }else{
    const t=back.ifr; back.pbi.style.display="none"; t.style.display="block"; applyCrop(back,cmd.cropTop||0);
    t.onload=()=>{t.onload=null; if(wg===warmGen&&g0===gen){WARM[back.id]={url:cmd.url};WARMLOADING[back.id]=null;}};
    try{t.src=cmd.url;}catch(e){ WARMLOADING[back.id]=null; }
  }
}

/* ---------- deciding what to show (clock-math rotation) ---------- */
function imgWrap(u){ /* full-bleed page for direct image links (logo slices, photos) */
  return "data:text/html;charset=utf-8,"+encodeURIComponent(
    '<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#000;overflow:hidden}img{position:fixed;inset:0;width:100vw;height:100vh;object-fit:fill}</style></head><body><img src="'+u+'"></body></html>');
}
function isImg(u){return /\.(png|jpe?g|gif|webp)(\?|$)/i.test(u||"")||/^data:image\//.test(u||"");}
function cmdFor(contentId,extra){
  const c=cById(contentId); if(!c) return null;
  if(SETTINGS.canvasPages===true&&/^wallpage:[a-z0-9-]{1,32}$/.test(c.url||"")) /* new kind, switch on only */
    return Object.assign({url:c.url,contentId:c.id,tokenEmbed:false,wallpage:c.url.slice(9),settleMs:c.settle_ms??300,cropTop:0},extra||{});
  const pbi=isPbi(c.url);
  if(!pbi&&isImg(c.url)) return Object.assign({url:imgWrap(c.url),contentId:c.id,tokenEmbed:false,settleMs:c.settle_ms??500,cropTop:0},extra||{});
  return Object.assign({url:c.url,contentId:c.id,tokenEmbed:pbi,
    settleMs:c.settle_ms??(pbi?3000:800),
    cropTop:pbi?(SETTINGS.bannerCropPx??0):0},extra||{});
}
function rotationNow(){
  if(!ROT||!ROT.active||!ROT.items||!ROT.items.length) return null;
  const items=ROT.items.filter(i=>i.enabled!==false&&SCENES.find(s=>s.id===i.sceneId));
  if(!items.length) return null;
  const cycle=items.reduce((a,i)=>a+(i.seconds||30)*1000,0);
  let elapsed;
  if(ROT.paused){ elapsed=(new Date(ROT.paused_at||ROT.started_at)-new Date(ROT.started_at)); }
  else elapsed=NOW()-new Date(ROT.started_at).getTime();
  let pos=((elapsed%cycle)+cycle)%cycle;
  for(const it of items){ const d=(it.seconds||30)*1000;
    if(pos<d) return {item:it,remain:d-pos,items,idx:items.indexOf(it)};
    pos-=d; }
  return {item:items[0],remain:(items[0].seconds||30)*1000,items,idx:0};
}
let lastShownKey=null, flipTimer=null, WHY="";
function scheduleFlip(remain){
  if(flipTimer) clearTimeout(flipTimer);
  flipTimer=setTimeout(()=>{ flipTimer=null; tick(); }, Math.max(20,remain+15));
}
function tick(){
  if(STOP) return;
  const r=rotationNow();
  if(r){
    const sc=SCENES.find(s=>s.id===r.item.sceneId);
    const cid=sc&&sc.map&&sc.map[SCREEN];
    WHY = !sc ? "scene id "+r.item.sceneId.slice(0,8)+" MISSING"
        : !cid ? "screen "+SCREEN+" NOT IN scene '"+(sc.name||"?")+"'"
        : !cById(cid) ? "content "+cid.slice(0,10)+" DELETED (scene '"+(sc.name||"?")+"' points to it)"
        : "";
    const key="rot:"+r.item.sceneId+":"+cid;
    if(cid&&key!==lastShownKey){
      const cmd=cmdFor(cid,{effect:r.item.transition,speed:r.item.speed});
      if(cmd){lastShownKey=key;show(cmd);} }
    if(!ROT.paused) scheduleFlip(r.remain);
    /* prewarm the NEXT scene early in THIS slot: maximum head start, once per slot */
    const slotMs=(r.item.seconds||30)*1000;
    if(!ROT.paused && r.remain < slotMs-5000){
      const nx=r.items[(r.idx+1)%r.items.length];
      const sc2=SCENES.find(s=>s.id===nx.sceneId);
      const cid2=sc2&&sc2.map&&sc2.map[SCREEN];
      if(cid2&&cid2!==cid){const p=cmdFor(cid2); if(p)prewarm(p);}
    }
    return;
  }
  if(ASSIGN){
    if(ASSIGN.kind==="clear"){ if(lastShownKey!=="clear"){lastShownKey="clear";
      gen++; cleanBuf(front);cleanBuf(back);front.el.classList.remove("front");currentUrl=null;hideBoot();} return; }
    const key="man:"+ASSIGN.content_id;
    if(ASSIGN.content_id&&key!==lastShownKey){const cmd=cmdFor(ASSIGN.content_id);if(cmd){lastShownKey=key;show(cmd);}}
  }
}

/* ---------- wall pages, shared clock, figures feed (canvasPages on only) ---------- */
function deviceSecret(){ return DEVICE; }
function healthNow(){ /* fixed codes and numbers only, never names or free text */
  const cs=CANVAS.clock?CANVAS.clock.stats():{};
  const fs=CANVAS.feed?CANVAS.feed.status():{};
  return {state:!currentUrl?"waiting":(fs.stale?"stale":"showing"), err:CANVAS.err,
    showing:(lastCmd&&typeof lastCmd.contentId==="string"&&/^[A-Za-z0-9_:.-]{1,64}$/.test(lastCmd.contentId))?lastCmd.contentId:null,
    off:Number.isInteger(cs.offsetMs)?cs.offsetMs:null, rtt:Number.isInteger(cs.rttMs)?cs.rttMs:null, ver:fs.version||0};
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function canvasStart(){
  if(CANVAS.ready) return CANVAS.ready;
  CANVAS.on=true;
  WallLayout.configure(SETTINGS.wallLayout);
  CANVAS.ready=(async()=>{
    await Promise.all(["wall-clock.js","wall-render.js","wall-feed-client.js"].map(loadScript));
    const fnBase=String(C.SUPA_URL).replace(/\/$/,"")+"/functions/v1/";
    const hdr={apikey:C.SUPA_KEY,Authorization:"Bearer "+C.SUPA_KEY};
    /* time from the read-only database function (REST API); the edge function `clock` only as fallback */
    CANVAS.clock=WallClock.create({url:String(C.SUPA_URL).replace(/\/$/,"")+"/rest/v1/rpc/wall_now",fallbackUrl:fnBase+"clock",headers:hdr,
      resyncSamples:2,resyncMs:120000}); /* 8 at start, then 2 every 2 minutes (user decision 24 Oct: Free plan egress and log lines) */
    try{ await CANVAS.clock.start(); }catch(e){ CANVAS.err="CLOCK_UNREACHABLE"; }
    CANVAS.feed=WallFeed.create({url:fnBase+"wall-feed",anonKey:C.SUPA_KEY,screen:SCREEN,key:KEY,device:deviceSecret(),
      now:NOW,storage:safeStorage(),health:healthNow});
    /* a monitoring mirror (wall.html) has no screen secret: the feed would refuse every call, and each refused call still
       counts against the Free plan, so a mirror does not ask (checker_figs3b M3) */
    if(!(qs.get("mirror")==="1"&&!DEVICE)) CANVAS.feed.start();
  })();
  return CANVAS.ready;
}
/* switch on at runtime: start; switch off at runtime: reload, which brings back today's behaviour exactly */
function canvasCheck(){
  if(SETTINGS.canvasPages===true&&!CANVAS.on){ canvasStart(); currentUrl=null; lastShownKey=null; return; }
  if(SETTINGS.canvasPages!==true&&CANVAS.on){ location.reload(); return; }
  if(CANVAS.on){ const a=WallLayout.bezelPx, s=WallLayout.safePx, n=WallLayout.configure(SETTINGS.wallLayout);
    if(n.bezelPx!==a||n.safePx!==s){ currentUrl=null; lastShownKey=null; } }
}
async function wpPage(id){
  if(CANVAS.pages[id]) return CANVAS.pages[id];
  const r=await fetch("wallpages/"+id+".json",{cache:"no-store"});
  if(!r.ok) throw new Error("page");
  const p=await r.json();
  if(WallRender.checkPage(p,WallLayout).some(x=>x==="PAGE_NOT_OBJECT"||x==="PAGE_ID")) throw new Error("page");
  CANVAS.pages[id]=p; return p;
}
/* the approved story design (engine "story5"): its scripts load once, in order, only when a screen first shows it */
function storyReady(){
  if(!CANVAS.story) CANVAS.story=(async()=>{ for(const s of ["wallstory/hmg_mark_mono_shape.js","wallstory/story_geo_public.js","wallstory/story5d_engine.js","wallstory/story5e_stories.js","wall-story.js"]) await loadScript(s); })();
  return CANVAS.story;
}
async function wpLoad(b,cmd){
  await CANVAS.ready;
  const page=await wpPage(cmd.wallpage);
  if(page.engine==="story5") await storyReady();
  if(!b.wp){ b.wp=document.createElement("div"); b.wp.className="wp";
    b.wp.style.cssText="position:absolute;inset:0;width:100%;height:100%;overflow:hidden;display:none;background:#000";
    b.el.appendChild(b.wp); }
  if(b.wpView){ try{b.wpView.destroy();}catch(e){} b.wpView=null; }
  b.ifr.style.display="none"; b.pbi.style.display="none"; b.wp.style.display="block";
  b.wpView=(page.engine==="story5"?WallStory:WallRender).mount(b.wp,page,{screen:SCREEN,layout:WallLayout,now:NOW,feed:CANVAS.feed});
  if(b.wpView.info().tilesSkipped) CANVAS.err="TILE_OUTSIDE_SAFE";
  /* wall pages never enter pbiReports, so the 10-minute report.refresh() below never touches them */
}

/* ---------- data load + realtime ---------- */
async function loadAll(){
  const [se,co,sc,ro,as]=await Promise.all([
    sb.from("settings").select("*").eq("id","main").single(),
    sb.from("content").select("*").order("sort").order("created_at"),
    sb.from("scenes").select("*").order("sort").order("created_at"),
    sb.from("rotation").select("*").eq("id","main").single(),
    sb.from("assignments").select("*").eq("screen",SCREEN).single()
  ]);
  if(se.error) throw se.error;
  SETTINGS=Object.assign({},se.data.data||{}); SETTINGS._screen_key=se.data.screen_key;
  CONTENT=co.data||[]; SCENES=sc.data||[]; ROT=ro.data; ASSIGN=as.data;
}
function subscribe(){
  sb.channel("wall")
    .on("postgres_changes",{event:"*",schema:"public",table:"assignments",filter:"screen=eq."+SCREEN},
        p=>{ASSIGN=p.new||ASSIGN;lastShownKey=null;tick();})
    .on("postgres_changes",{event:"*",schema:"public",table:"rotation"},p=>{ROT=p.new||ROT;lastShownKey=null;tick();})
    .on("postgres_changes",{event:"*",schema:"public",table:"scenes"},()=>loadAll().then(tick))
    .on("postgres_changes",{event:"*",schema:"public",table:"content"},()=>loadAll().then(tick))
    .on("postgres_changes",{event:"*",schema:"public",table:"settings"},p=>{
        if(p.new){const wasId=(SETTINGS._identify_seen===((p.new.data||{})._identify));
          const oldSig=JSON.stringify({f:SETTINGS.fit,c:SETTINGS.bannerCropPx,d:SETTINGS.dateFilter});
          SETTINGS=Object.assign({},p.new.data||{});SETTINGS._screen_key=p.new.screen_key;
          if(SETTINGS._identify&&!wasId){SETTINGS._identify_seen=SETTINGS._identify;identifyFlash();}
          if(SETTINGS._forceSync&&SETTINGS._forceSync!==SETTINGS._fs_seen){SETTINGS._fs_seen=SETTINGS._forceSync;lastShownKey=null;}
          const newSig=JSON.stringify({f:SETTINGS.fit,c:SETTINGS.bannerCropPx,d:SETTINGS.dateFilter});
          if(oldSig!==newSig){ currentUrl=null; lastShownKey=null; }
          if(SETTINGS.canvasPages===true||CANVAS.on) canvasCheck();
          if(reloadIfNewer()) return;
          tick(); /* visual settings re-render; identify and the rest leave warm layers alive */}})
    .subscribe();
}
const DEBUG=qs.get("debug")==="1";
if(DEBUG){ const d=document.createElement("div");
  d.id="dbg"; d.style.cssText="position:fixed;left:6px;bottom:6px;z-index:60;background:rgba(0,0,0,.75);color:#8ff5c2;font:11px Consolas,monospace;padding:6px 8px;border-radius:6px;max-width:60vw;white-space:pre";
  document.body.appendChild(d);
  setInterval(()=>{ const r=rotationNow();
    d.textContent="front:"+(currentUrl||"-").slice(-38)
      +"\nwarm(back):"+((WARM[back.id]||{}).url||"-").slice(-38)
      +"\nloading:"+((WARMLOADING[back.id]||{}).url||"-").slice(-30)
      +"\nrot:"+(r?("idx "+r.idx+" remain "+Math.round(r.remain/1000)+"s"):"off")
      +"\ngen:"+gen+" key:"+String(lastShownKey||"-").slice(0,34)
      +(WHY?"\nWHY: "+WHY:"")
      +"  offset:"+Math.round(CLOCK_OFFSET)+"ms"; },500); }
/* ---------- screen enrolment and key check (brief step 2) ---------- */
async function screenCheck(){
  try{
    const r=await tokenPost({action:"check",s:SCREEN,k:KEY,d:DEVICE,sid:(qs.get("mirror")==="1"?"":SID)});
    let j=null; try{ j=await r.json(); }catch(e){}
    if(r.status===403&&j&&j.error==="bad key"){
      if(SETTINGS._screen_key){ LEGACY_FN=true; return; } /* key cell present: the local check already decided (old function) */
      /* cell empty: refuse only if the old request form says the same (the old function answers "bad key" to every new-form call) */
      const r2=await fetch(C.TOKEN_FN+"?content=__keycheck__&k="+encodeURIComponent(KEY)); let j2=null; try{ j2=await r2.json(); }catch(e){}
      if(r2.status===403&&j2&&j2.error==="bad key"){ if(!SETTINGS._screen_key) refuseKey(); return; }
      LEGACY_FN=true; return; }
    /* the notice appears on screens only once enforcement is on; before that the console shows who is not set up */
    if(r.ok&&j&&j.key===true&&j.enrolled===false&&j.required===true) enrolNotice(true);
  }catch(e){}
}
/* switch on and the key cell empty or hidden: the server must confirm the key at start. "ok" | "bad" | "unreachable" */
async function serverKey(){
  try{
    const r=await tokenPost({action:"check",s:SCREEN,k:KEY,d:DEVICE,sid:(qs.get("mirror")==="1"?"":SID)});
    let j=null; try{ j=await r.json(); }catch(e){}
    if(r.ok&&j&&j.key===true) return "ok";
    if(r.status===403&&j&&j.error==="bad key"){ /* the old function answers "bad key" to every new-form call: ask it the old way */
      const r2=await fetch(C.TOKEN_FN+"?content=__keycheck__&k="+encodeURIComponent(KEY)); let j2=null; try{ j2=await r2.json(); }catch(e){}
      if(r2.status===403&&j2&&j2.error==="bad key") return "bad";
      if(r2.status===400){ LEGACY_FN=true; return "ok"; } /* old function: key accepted, unknown content */
    }
    return "unreachable";
  }catch(e){ return "unreachable"; }
}
function refuseKey(){
  STOP=true; gen++; cleanBuf(front); cleanBuf(back); front.el.classList.remove("front"); currentUrl=null;
  document.getElementById("keyerr").style.display="flex";
  document.getElementById("boot").style.display="none";
}
function enrolNotice(required){
  let n=document.getElementById("enrol");
  if(!n){ n=document.createElement("div"); n.id="enrol";
    n.style.cssText="position:fixed;left:2vw;right:2vw;bottom:2vh;z-index:55;padding:12px 18px;border-radius:10px;background:rgba(20,10,4,.88);color:#F0A04A;font:600 max(18px,1.5vw) Segoe UI,sans-serif;text-align:center";
    document.body.appendChild(n); }
  n.textContent="This screen PC is not set up, so reports cannot load. Use this screen's link from the console (Screen PCs).";
}
function identifyFlash(){ const d=document.getElementById("identify");
  d.textContent=SCREEN; d.style.display="flex"; after(4000,()=>d.style.display="none"); }

/* ---------- boot ---------- */
(async()=>{
  await syncClock(); setInterval(()=>{ if(!CANVAS.on) syncClock(); }, 10*60000); /* canvasPages on: the shared clock replaces it (Free plan, builder_figs_free.md) */
  try{ await loadAll(); RELOAD_SEEN=+SETTINGS._reloadAt||0; /* the value this page started with */ }
  catch(e){ document.getElementById("keyerr").textContent="Cannot reach the wall database.\nCheck internet / setup."; 
    document.getElementById("keyerr").style.display="flex"; console.error(e); return; }
  /* key check. Both switches off (canvasPages, deviceChecks): main's exact rule, so an empty or hidden key cell refuses every screen.
     Either on: a key cell that is present must equal the key; an empty or hidden cell (rollout step 9) refuses unless the server
     itself confirms this key first, so it is never weaker than main; nothing plays before that answer. */
  const SEC=SETTINGS.canvasPages===true||SETTINGS.deviceChecks===true;
  let keyRes=null;
  if(SEC&&KEY&&!SETTINGS._screen_key) keyRes=await serverKey();
  if(!SEC ? (!SETTINGS._screen_key || KEY!==SETTINGS._screen_key) : (!KEY || (SETTINGS._screen_key ? KEY!==SETTINGS._screen_key : keyRes!=="ok"))){
    document.getElementById("keyerr").style.display="flex";
    document.getElementById("boot").style.display="none";
    if(keyRes==="unreachable") after(60000,()=>location.reload()); /* the server could not answer: ask again in a minute (still refused meanwhile) */
    return; }
  if(SETTINGS.canvasPages===true) canvasStart();
  subscribe();
  tick();
  setInterval(tick,1000);
  /* both switches off (canvasPages, deviceChecks): exactly today's network traffic (old GET token form, no background key check);
     either on: the new token form and the background key check, which also records the screen's session for the console's
     step 6 and 7 gates (security rollout, paused D-237: deviceChecks on, then "Reload all screens", BEFORE its step 6) */
  if(SETTINGS.canvasPages===true||SETTINGS.deviceChecks===true) screenCheck(); /* background: never delays or blanks the wall unless the server clearly refuses the key */
  else LEGACY_FN=true;
  setInterval(()=>{ const b=document.getElementById("bootWhy");
    if(b&&WHY) b.textContent="Waiting: "+WHY; },1500);
  /* safety net: realtime is the primary channel; this backup poll runs every 5 MINUTES
     and never when the tab is hidden — cuts database egress ~40x */
  let BACKUP_TICK=0; /* canvasPages on: every 30 minutes (Free plan egress, builder_figs3b.md); switch off: every 5 minutes as before */
  setInterval(()=>{ if(CANVAS.on&&(++BACKUP_TICK%6)) return; if(!document.hidden) loadAll().then(()=>{ if(reloadIfNewer()) return; if(SETTINGS.canvasPages===true||CANVAS.on) canvasCheck(); }).catch(()=>{}); },300000);
  /* DATA refresh: re-query visuals on every live embed (visible + warm) */
  const refMin=Math.max(5,(SETTINGS.autoRefreshMinutes||10));
  setInterval(()=>{ Object.values(pbiReports).forEach(r=>{ try{ r.refresh().catch(()=>{});}catch(e){} }); },refMin*60000);
  /* TOKEN renewal: fresh embed token long before expiry, for every live embed */
  setInterval(()=>{ Object.keys(pbiReports).forEach(id=>{
    const cid=pbiMeta[id]; if(!cid) return;
    tokenConfig(cid,true).then(async cfg=>{ try{ await pbiReports[id].setAccessToken(cfg.token);}catch(e){} })
      .catch(()=>{});
  }); },40*60000);
  /* daily reload for freshness at 03:00 */
  setInterval(()=>{const d=new Date();if(d.getHours()===3&&d.getMinutes()===0)location.reload();},60000);
})();
